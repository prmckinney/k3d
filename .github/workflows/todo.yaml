name: Build and publish application

on:
  push:
    paths:
      - "the_project/**"
      - ".github/workflows/todo.yaml"
jobs:
  build:
    name: Build, Push
    runs-on: ubuntu-latest
    environment: ArgoCD

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - service_name: todo_app
            context: ./the_project/todo-app
            image_name: prmckinney/k3d_todo_app
            kustom_name: PROJECT/FRONTEND

          - service_name: todo_backend
            context: ./the_project/todo-backend
            image_name: prmckinney/k3d_todo_backend
            kustom_name: PROJECT/BACKEND

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Only execute steps if the specific service directory or the workflow file changed
      - name: Check for changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            should_run:
              - '${{ matrix.context }}/**'
              - '.github/workflows/todo.yaml'

      - name: Login to Docker Hub
        if: ${{ steps.filter.outputs.should_run == 'true' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # tag image with the GitHub SHA to get a unique tag
      - name: Build and publish backend
        if: ${{ steps.filter.outputs.should_run == 'true' }}
        run: |-
          docker build --tag "${{matrix.image_name}}:$GITHUB_SHA" ${{matrix.context}}
          docker push "${{matrix.image_name}}:$GITHUB_SHA"

      - name: Kustomize command
        if: ${{ steps.filter.outputs.should_run == 'true' }}
        run: |
          echo "kustomize edit set image ${{ matrix.kustom_name }}=${{ matrix.image_name }}:$GITHUB_SHA" > kustom-${{ matrix.service_name }}.sh

      - name: Upload Kustomize command
        if: ${{ steps.filter.outputs.should_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: kustom-${{ matrix.service_name }}
          path: kustom-${{ matrix.service_name }}.sh

  commit:
    name: Build, Push, Release
    runs-on: ubuntu-latest
    needs: build
    environment: ArgoCD

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: kustom-*
          path: ./the_project

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Run Kustomize
        working_directory: ./the_project
        run: |
          for file in kustom-*.sh; do source $file; done

      - name: commit kustomization.yaml to GitHub
        uses: EndBug/add-and-commit@v10
        with:
          add: "./the_project/kustomization.yaml"
          message: New version released ${{ github.sha }}
