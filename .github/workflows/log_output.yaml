name: Build and publish application

on:
  push:
    paths:
      - "log_output/**"
      - ".github/workflows/log_output.yaml"
jobs:
  build:
    name: Build, Push
    runs-on: ubuntu-latest
    environment: ArgoCD

    strategy:
      fail-fast: false
      matrix:
        include:
          - service_name: log_output_server
            context: ./log_output/serve_string
            image_name: prmckinney/k3d_log_output_server
            kustom_name: EXERCISE/FRONTEND
          - service_name: log_output_write
            context: ./log_output/write_string
            image_name: prmckinney/k3d_log_output_write
            kustom_name: EXERCISE/BACKEND
          - service_name: ping_pong
            context: ./log_output/ping_pong
            image_name: prmckinney/k3d_ping_pong
            kustom_name: EXERCISE/PINGPONG

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Only execute steps if the specific service directory or the workflow file changed
      - name: Check for changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            should_run:
              - '${{ matrix.context }}/**'
              - '.github/workflows/log_output.yaml'

      - name: Login to Docker Hub
        if: ${{ steps.filter.outputs.should_run == 'true' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # tag image with the GitHub SHA to get a unique tag
      - name: Build and publish backend
        if: ${{ steps.filter.outputs.should_run == 'true' }}
        run: |-
          docker build --tag "${{matrix.image_name}}:$GITHUB_SHA" ${{matrix.context}}
          docker push "${{matrix.image_name}}:$GITHUB_SHA"

      - name: Kustomize command
        if: ${{ steps.filter.outputs.should_run == 'true' }}
        run: |
          echo "kustomize edit set image ${{ matrix.kustom_name }}=${{ matrix.image_name }}:$GITHUB_SHA" > kustom-${{ matrix.service_name }}.sh

      - name: Upload Kustomize command
        if: ${{ steps.filter.outputs.should_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: kustom-${{ matrix.service_name }}.sh
          path: kustom-${{ matrix.service_name }}.sh

  commit:
    name: Modify and Commit Kustomize
    runs-on: ubuntu-latest
    needs: build
    environment: ArgoCD

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download All Artifacts
        uses: actions/download-artifact@v4

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Run Kustomize
        working-directory: ./log_output
        run: |
          for file in ../kustom-*.sh/*; do source $file; done

      - name: commit kustomization.yaml to GitHub
        uses: EndBug/add-and-commit@v10
        with:
          add: "./log_output/kustomization.yaml"
          message: New version released ${{ github.sha }}
