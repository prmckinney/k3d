apiVersion: v1
kind: Service
metadata:
  name: log-output-svc
  namespace: exercises
spec:
  type: LoadBalancer
  selector:
    app: log-output
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3000 # This is the target port
---
apiVersion: v1
kind: Service
metadata:
  name: ping-pong-svc
  namespace: exercises
spec:
  type: LoadBalancer
  selector:
    app: ping-pong
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3000 # This is the target port
