apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output-dep
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: shared-log
          persistentVolumeClaim:
            claimName: log-claim
        - name: config
          configMap:
            name: log-configmap
            items:
              - key: "information.txt"
                path: "information.txt"
      containers:
        - name: log-output-write
          image: prmckinney/k3d_log_output_write:1.10
          volumeMounts:
            - name: shared-log
              mountPath: /usr/src/app/files
        - name: log-output-server
          image: prmckinney/k3d_log_output_server:2.5
          env:
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: log-configmap
                  key: message
          volumeMounts:
            - name: shared-log
              mountPath: /usr/src/app/files
            - name: config
              mountPath: "/config"
              readOnly: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong-dep
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      volumes:
        - name: shared-log
          persistentVolumeClaim:
            claimName: log-claim
      containers:
        - name: ping-pong
          image: prmckinney/k3d_ping_pong:2.1
          env:
            - name: DIR
              value: "/usr/src/app/files"
          volumeMounts:
            - name: shared-log
              mountPath: /usr/src/app/files
