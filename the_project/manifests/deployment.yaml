apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app-dep
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: shared-todo
          persistentVolumeClaim:
            claimName: todo-claim
      containers:
        - name: todo-app
          image: prmckinney/k3d_todo_app:2.6
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "8080"
            - name: BACKEND_URL
              value: "http://localhost:3000"
        - name: todo-backend
          image: prmckinney/k3d_todo_backend:2.2
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "3000"
            - name: DIR
              value: "/usr/src/app/files"
          volumeMounts:
            - name: shared-todo
              mountPath: /usr/src/app/files
