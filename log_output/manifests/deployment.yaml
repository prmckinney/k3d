apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: shared-uuid
          emptyDir: {}
      containers:
        - name: log-output-write
          image: prmckinney/k3d_log_output_write:1.10
          volumeMounts:
            - name: shared-uuid
              mountPath: /usr/src/app/files
        - name: log-output-read
          image: prmckinney/k3d_log_output_read:1.10
          volumeMounts:
            - name: shared-uuid
              mountPath: /usr/src/app/files
